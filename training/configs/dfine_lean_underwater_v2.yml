# D-FINE-L lean underwater v2 (Phase 3 retrain A, 2026-11-14). Fixes lean v1's setup (docs/evidence/phase3/
# lean_v1_check, lean_v1_diag_lowscore: nearly blind on dev). v1 trained only on the lean set, whose train split
# is 448 images with just 175 boxes (most frames empty), for 8 epochs from the COCO base, so it learned "no person".
# v2 trains on v03's data (sprint_r1, which already contains seed_r1 with its deliberate x2 oversampling) PLUS
# the lean set, merged by training/tools/merge_coco.py into absolute-path COCO json (img_folder is then unused).
# Start: training\weights\dfine_l_coco.pth via -t. No trained 2-class .pth exists on this machine, and recovering
# one from lifeguard_dfine_l_pool_v0.onnx was ruled out (only 201/1173 training keys named; deploy() fused layers).
# Still dev_only (CLAUDE.md): neither the seed/sprint nor the lean footage is rights-cleared.
__include__: ['dfine_l_v03.yml']

output_dir: C:/aquaguard/training/work_dirs/dfine_lean_underwater_v2
epochs: 30                       # augmentation and multi-scale stop for the last 4 epochs
lr_warmup_scheduler: {type: LinearWarmup, warmup_duration: 300}   # v0's value: the class head starts untrained

train_dataloader:
  dataset:
    img_folder: C:/aquaguard/data/dataset/merged_v2
    ann_file: C:/aquaguard/data/dataset/merged_v2/train.json
    transforms:
      policy:
        name: stop_epoch
        epoch: 26
        ops: ['PoolPhotometric', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    stop_epoch: 26

val_dataloader:
  dataset:
    img_folder: C:/aquaguard/data/dataset/merged_v2
    ann_file: C:/aquaguard/data/dataset/merged_v2/val.json

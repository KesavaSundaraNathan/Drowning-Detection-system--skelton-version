# D-FINE-L lean underwater v1 (Phase 3, 2026-11-14): fine-tunes v03 further on the Lean Data Strategy
# set - ~30 clips (extract_and_prelabel.py auto-labelled above-water, MakeSense.ai manually filled in
# the submerged misses: docs/evidence/phase3/dev_run1 vis:underwater 0/14, vis:head 0/4). Every box
# mapped to category_id 0 (swimmer) per owner decision - see training/tools/yolo_to_coco_lean.py.
# Run yolo_to_coco_lean.py first to produce the two ann_files below. Still dev_only (CLAUDE.md) -
# footage rights for this dataset are unconfirmed; this config does not change that.
__include__: ['dfine_l_v03.yml']

output_dir: C:/lifeguard/training/work_dirs/dfine_lean_underwater_v1
epochs: 8                      # ~500 frames, 30 clips: small set, short run - watch val AP50/recall for overfit

train_dataloader:
  dataset:
    img_folder: C:/aquaguard/data/dataset/lean_underwater_v1/images
    ann_file: C:/aquaguard/data/dataset/lean_underwater_v1/coco/train.json

val_dataloader:
  dataset:
    img_folder: C:/aquaguard/data/dataset/lean_underwater_v1/images
    ann_file: C:/aquaguard/data/dataset/lean_underwater_v1/coco/val.json

# Life Guard v3 CI. Runs EXACTLY the steps of tools/ci.ps1 (same script locally and here).
# The GPU smoke (tools/gpu_smoke.py) needs an NVIDIA GPU and runs locally via `tools/ci.ps1 -Gpu`
# or on a self-hosted GPU runner; hosted windows-latest runners have no GPU.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege: CI never writes to the repo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved; SHAs cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020    # v7.0.0
        with:
          node-version: "24"

      - name: CI pipeline (tools/ci.ps1)
        shell: pwsh
        run: ./tools/ci.ps1 -Ci

      - name: Upload CI artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-artifacts
          path: ci-artifacts/
          if-no-files-found: warn
